<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Desk Dashboard</title>
  <style>
    :root {
      --bg: #000000;
      --card: #121214;
      --sub-card: #1a1a1e;
      --border: #242429;
      --text-main: #f4f4f6;
      --text-sub: #8e8e93;
      --accent: #3b82f6;
      --green: #10b981;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif;
      height: 100vh;
      overflow: hidden;
      padding: 16px;
      transition: filter 0.5s ease, transform 1s ease;
    }
    body.night-mode { filter: brightness(0.4); }

    /* 모달 공통 */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    .overlay.hidden { display: none; }
    .modal-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      width: 100%;
      max-width: 390px;
      text-align: center;
    }
    .modal-box h2 { font-size: 1.2rem; margin-bottom: 10px; }
    .modal-box p { font-size: 0.85rem; color: var(--text-sub); line-height: 1.5; margin-bottom: 18px; }
    .modal-box input, .modal-box select {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #1c1c20;
      color: var(--text-main);
      font-size: 0.95rem;
      margin-bottom: 12px;
      outline: none;
    }
    .modal-box input:focus, .modal-box select:focus { border-color: var(--accent); }
    .tag-chips {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    .tag-chip {
      flex: 1;
      padding: 7px 0;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #1c1c20;
      color: var(--text-sub);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .tag-chip.selected {
      background: rgba(59, 130, 246, 0.2);
      border-color: var(--accent);
      color: var(--text-main);
    }
    .modal-actions { display: flex; gap: 8px; }
    .modal-box button.primary-btn {
      flex: 1;
      padding: 11px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .modal-box button.cancel-btn {
      flex: 1;
      padding: 11px;
      border-radius: 10px;
      border: none;
      background: #27272a;
      color: var(--text-sub);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .pair-error { color: var(--danger); font-size: 0.8rem; margin-top: 10px; min-height: 1.2em; }

    /* 메인 벤토 그리드 */
    .grid {
      display: grid;
      grid-template-columns: 1.15fr 1.35fr;
      grid-template-rows: 1fr 0.72fr 1.1fr;
      gap: 14px;
      height: 100%;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .card-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-sub);
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .mini-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-sub);
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    .mini-btn.accent {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* 1. 시계 & 날씨 */
    .clock-time { font-size: 4rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
    .clock-date { font-size: 1.05rem; color: var(--text-sub); margin-top: 6px; }
    .weather-box {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .temp { font-size: 2rem; font-weight: 600; }
    .weather-desc { color: var(--text-sub); font-size: 0.95rem; }

    /* 2. 포모도로 & 디데이 */
    .tools-row {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 14px;
    }
    .pomo-display {
      font-size: 2.1rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      margin: auto 0;
    }
    .pomo-controls { display: flex; gap: 6px; margin-top: 8px; }
    .pomo-controls button {
      flex: 1;
      padding: 6px 0;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--sub-card);
      color: var(--text-main);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }
    .pomo-controls button.active { background: var(--accent); border-color: var(--accent); }

    .dday-card { cursor: pointer; }
    .dday-count {
      font-size: 2.1rem;
      font-weight: 700;
      color: var(--accent);
      margin: auto 0;
    }
    .dday-label {
      font-size: 0.85rem;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 3. 메모 & 피드 */
    .list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
    .feed-item {
      padding: 9px 10px;
      border-radius: 10px;
      background: var(--sub-card);
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.2s, background 0.15s;
    }
    .feed-item:active { background: #242429; }
    .feed-check {
      width: 16px;
      height: 16px;
      border-radius: 5px;
      border: 1.5px solid var(--text-sub);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      flex-shrink: 0;
    }
    .feed-item.done { opacity: 0.45; }
    .feed-item.done .feed-check {
      background: var(--green);
      border-color: var(--green);
      color: #000;
      font-weight: 700;
    }
    .feed-item.done .feed-text { text-decoration: line-through; }
    .feed-tag {
      font-size: 0.68rem;
      padding: 2px 6px;
      border-radius: 6px;
      background: #27272a;
      color: #a1a1aa;
      flex-shrink: 0;
    }
    .feed-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 4. 우측 전체: 일정 */
    .schedule-card { grid-row: 1 / 4; grid-column: 2 / 3; }
    .item {
      background: var(--sub-card);
      padding: 12px 14px;
      border-radius: 12px;
      border-left: 4px solid var(--accent);
    }
    .item-time { font-size: 0.78rem; color: var(--text-sub); margin-bottom: 4px; }
    .item-title { font-size: 0.98rem; font-weight: 500; }
  </style>
</head>
<body>

  <!-- 최초 1회 페어링 모달 -->
  <div id="pairing-overlay" class="overlay hidden">
    <div class="modal-box">
      <h2>기기 최초 페어링</h2>
      <p>페어링 QR 코드를 스캔하거나<br>발급받은 ACCESS_TOKEN을 입력하세요.</p>
      <input type="password" id="token-input" placeholder="64자리 토큰 입력" autocomplete="off" />
      <div class="modal-actions">
        <button class="primary-btn" id="pair-submit">기기 연결</button>
      </div>
      <div class="pair-error" id="pair-error"></div>
    </div>
  </div>

  <!-- 디데이 설정 모달 -->
  <div id="dday-overlay" class="overlay hidden">
    <div class="modal-box">
      <h2>D-Day 목표 설정</h2>
      <p>디데이 제목과 목표 날짜를 지정하세요.</p>
      <input type="text" id="dday-title-input" placeholder="예: 프로젝트 마감" maxlength="20" />
      <input type="date" id="dday-date-input" />
      <div class="modal-actions">
        <button class="cancel-btn" id="dday-cancel">취소</button>
        <button class="primary-btn" id="dday-save">저장</button>
      </div>
    </div>
  </div>

  <!-- 새 메모 추가 모달 -->
  <div id="memo-overlay" class="overlay hidden">
    <div class="modal-box">
      <h2>새 메모 / 할 일 추가</h2>
      <p>입력한 내용은 구글 시트 Memo 탭에 즉시 저장됩니다.</p>
      <div class="tag-chips" id="memo-tag-chips">
        <button type="button" class="tag-chip selected" data-tag="TODO">TODO</button>
        <button type="button" class="tag-chip" data-tag="MEMO">MEMO</button>
        <button type="button" class="tag-chip" data-tag="IDEA">IDEA</button>
      </div>
      <input type="text" id="memo-text-input" placeholder="내용을 입력하세요 (최대 120자)" maxlength="120" autocomplete="off" />
      <div class="modal-actions">
        <button class="cancel-btn" id="memo-cancel">취소</button>
        <button class="primary-btn" id="memo-save">시트에 추가</button>
      </div>
    </div>
  </div>

  <!-- 대시보드 그리드 -->
  <div class="grid" id="dashboard-grid">
    <!-- 좌측 상단: 시계 & 날씨 -->
    <div class="card">
      <div class="card-title">
        <span>SEOUL, KR</span>
        <div>
          <span id="sync-status" style="margin-right: 8px;">INIT</span>
          <button class="mini-btn" id="unpair-btn">UNPAIR</button>
        </div>
      </div>
      <div class="clock-time" id="clock">00:00</div>
      <div class="clock-date" id="date">----년 --월 --일</div>
      <div class="weather-box">
        <span class="temp" id="temp">--°</span>
        <span class="weather-desc" id="weather-desc">날씨 불러오는 중...</span>
      </div>
    </div>

    <!-- 좌측 중단: 포모도로 타이머 + 디데이 위젯 -->
    <div class="tools-row">
      <div class="card">
        <div class="card-title">
          <span id="pomo-mode-label">FOCUS 25M</span>
          <button class="mini-btn" id="pomo-switch-btn">휴식전환</button>
        </div>
        <div class="pomo-display" id="pomo-time">25:00</div>
        <div class="pomo-controls">
          <button id="pomo-start-btn">시작</button>
          <button id="pomo-reset-btn">초기화</button>
        </div>
      </div>

      <div class="card dday-card" id="dday-widget" title="터치하여 디데이 수정">
        <div class="card-title">
          <span>D-DAY</span>
          <span id="dday-target-date">--.--</span>
        </div>
        <div class="dday-count" id="dday-count">D-0</div>
        <div class="dday-label" id="dday-label">목표 설정하기</div>
      </div>
    </div>

    <!-- 좌측 하단: 메모 & 피드 -->
    <div class="card">
      <div class="card-title">
        <span>MEMO & FEED</span>
        <button class="mini-btn accent" id="open-memo-btn">+ 추가</button>
      </div>
      <div class="list" id="feed-list"></div>
    </div>

    <!-- 우측 전체: 일정 -->
    <div class="card schedule-card">
      <div class="card-title"><span>UPCOMING SCHEDULE</span><span id="event-count">0건</span></div>
      <div class="list" id="schedule-list"></div>
    </div>
  </div>

  <script>
    const GAS_ENDPOINT = "%%GAS_ENDPOINT%%";
    const STORAGE_KEY = "DESK_PAIRED_TOKEN";
    const DDAY_STORAGE_KEY = "DESK_DDAY_CONFIG";

    /* ================= 1. 최초 1회 페어링 ================= */
    const pairingOverlay = document.getElementById('pairing-overlay');
    const tokenInput = document.getElementById('token-input');
    const pairError = document.getElementById('pair-error');

    function initPairing() {
      const existingToken = localStorage.getItem(STORAGE_KEY);
      const hash = window.location.hash;
      if (!existingToken && hash.startsWith('#token=')) {
        const extracted = decodeURIComponent(hash.replace('#token=', '')).trim();
        if (extracted) localStorage.setItem(STORAGE_KEY, extracted);
      }
      if (hash) {
        history.replaceState(null, '', window.location.pathname + window.location.search);
      }
    }

    function showPairingScreen(msg = '') {
      pairError.textContent = msg;
      pairingOverlay.classList.remove('hidden');
      tokenInput.value = '';
    }

    function hidePairingScreen() {
      pairingOverlay.classList.add('hidden');
      pairError.textContent = '';
    }

    /* ================= 2. 화면 상시 유지 & 번인 방지 ================= */
    async function keepScreenAwake() {
      try {
        if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
      } catch {}
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') keepScreenAwake();
    });

    function shiftPixels() {
      const x = Math.floor(Math.random() * 5) - 2;
      const y = Math.floor(Math.random() * 5) - 2;
      document.body.style.transform = `translate(${x}px, ${y}px)`;
    }

    /* ================= 3. 시계 & 야간 디밍 ================= */
    function updateClock() {
      const now = new Date();
      const h = now.getHours();
      const m = now.getMinutes();
      const s = now.getSeconds();

      document.getElementById('clock').textContent =
        `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      document.getElementById('date').textContent =
        `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 ${days[now.getDay()]}요일`;

      document.body.classList.toggle('night-mode', h >= 23 || h < 6);
      if (h === 4 && m === 0 && s === 0) location.reload();
    }

    /* ================= 4. 포모도로 타이머 ================= */
    let pomoMode = 'focus';
    let pomoSeconds = 25 * 60;
    let pomoInterval = null;

    const pomoTimeEl = document.getElementById('pomo-time');
    const pomoStartBtn = document.getElementById('pomo-start-btn');
    const pomoModeLabel = document.getElementById('pomo-mode-label');

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.6);
      } catch {}
    }

    function renderPomo() {
      const m = String(Math.floor(pomoSeconds / 60)).padStart(2, '0');
      const s = String(pomoSeconds % 60).padStart(2, '0');
      pomoTimeEl.textContent = `${m}:${s}`;
    }

    function stopPomo() {
      clearInterval(pomoInterval);
      pomoInterval = null;
      pomoStartBtn.textContent = '시작';
      pomoStartBtn.classList.remove('active');
    }

    pomoStartBtn.addEventListener('click', () => {
      if (pomoInterval) {
        stopPomo();
        return;
      }
      pomoStartBtn.textContent = '일시정지';
      pomoStartBtn.classList.add('active');
      pomoInterval = setInterval(() => {
        if (pomoSeconds > 0) {
          pomoSeconds--;
          renderPomo();
        } else {
          stopPomo();
          playBeep();
        }
      }, 1000);
    });

    document.getElementById('pomo-reset-btn').addEventListener('click', () => {
      stopPomo();
      pomoSeconds = pomoMode === 'focus' ? 25 * 60 : 5 * 60;
      renderPomo();
    });

    document.getElementById('pomo-switch-btn').addEventListener('click', (e) => {
      stopPomo();
      if (pomoMode === 'focus') {
        pomoMode = 'break';
        pomoSeconds = 5 * 60;
        pomoModeLabel.textContent = 'BREAK 5M';
        e.target.textContent = '집중전환';
        pomoTimeEl.style.color = 'var(--green)';
      } else {
        pomoMode = 'focus';
        pomoSeconds = 25 * 60;
        pomoModeLabel.textContent = 'FOCUS 25M';
        e.target.textContent = '휴식전환';
        pomoTimeEl.style.color = 'var(--text-main)';
      }
      renderPomo();
    });

    /* ================= 5. 디데이(D-Day) 카운터 ================= */
    const ddayOverlay = document.getElementById('dday-overlay');
    const ddayTitleInput = document.getElementById('dday-title-input');
    const ddayDateInput = document.getElementById('dday-date-input');

    function renderDday() {
      const saved = JSON.parse(localStorage.getItem(DDAY_STORAGE_KEY) || 'null');
      const countEl = document.getElementById('dday-count');
      const labelEl = document.getElementById('dday-label');
      const dateEl = document.getElementById('dday-target-date');

      if (!saved || !saved.date) {
        countEl.textContent = 'D-?';
        labelEl.textContent = '터치하여 목표 설정';
        dateEl.textContent = '--.--';
        return;
      }

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const target = new Date(saved.date + 'T00:00:00');
      const diffDays = Math.round((target - today) / (1000 * 60 * 60 * 24));

      if (diffDays === 0) countEl.textContent = 'D-DAY';
      else if (diffDays > 0) countEl.textContent = `D-${diffDays}`;
      else countEl.textContent = `D+${Math.abs(diffDays)}`;

      labelEl.textContent = saved.title || '목표일';
      dateEl.textContent = saved.date.slice(5).replace('-', '.');
    }

    document.getElementById('dday-widget').addEventListener('click', () => {
      const saved = JSON.parse(localStorage.getItem(DDAY_STORAGE_KEY) || '{}');
      ddayTitleInput.value = saved.title || '';
      ddayDateInput.value = saved.date || '';
      ddayOverlay.classList.remove('hidden');
    });

    document.getElementById('dday-cancel').addEventListener('click', () => {
      ddayOverlay.classList.add('hidden');
    });

    document.getElementById('dday-save').addEventListener('click', () => {
      const title = ddayTitleInput.value.trim();
      const date = ddayDateInput.value;
      if (date) {
        localStorage.setItem(DDAY_STORAGE_KEY, JSON.stringify({ title, date }));
        renderDday();
      }
      ddayOverlay.classList.add('hidden');
    });

    /* ================= 6. 새 메모 추가 모달 ================= */
    const memoOverlay = document.getElementById('memo-overlay');
    const memoTextInput = document.getElementById('memo-text-input');
    const memoSaveBtn = document.getElementById('memo-save');
    let selectedMemoTag = 'TODO';

    document.querySelectorAll('#memo-tag-chips .tag-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#memo-tag-chips .tag-chip').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedMemoTag = btn.dataset.tag;
      });
    });

    document.getElementById('open-memo-btn').addEventListener('click', () => {
      memoTextInput.value = '';
      memoOverlay.classList.remove('hidden');
      memoTextInput.focus();
    });

    document.getElementById('memo-cancel').addEventListener('click', () => {
      memoOverlay.classList.add('hidden');
    });

    async function submitNewMemo() {
      const title = memoTextInput.value.trim();
      const token = localStorage.getItem(STORAGE_KEY);
      if (!title || !token || !GAS_ENDPOINT.startsWith('http')) return;

      memoSaveBtn.disabled = true;
      memoSaveBtn.textContent = '저장 중...';
      document.getElementById('sync-status').textContent = 'SAVING';

      try {
        const res = await fetch(GAS_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'add', token: token, tag: selectedMemoTag, title: title })
        });
        const result = await res.json();
        if (result.status !== 'ok') throw new Error('Add failed');

        // 목록 최상단에 즉시 항목 추가
        const feedEl = document.getElementById('feed-list');
        const newEl = createFeedElement(result.item);
        feedEl.prepend(newEl);

        memoOverlay.classList.add('hidden');
        document.getElementById('sync-status').textContent = 'SYNCED';
      } catch {
        document.getElementById('sync-status').textContent = 'SAVE_ERR';
        alert('저장에 실패했습니다. 네트워크 상태를 확인하세요.');
      } finally {
        memoSaveBtn.disabled = false;
        memoSaveBtn.textContent = '시트에 추가';
      }
    }

    memoSaveBtn.addEventListener('click', submitNewMemo);
    memoTextInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitNewMemo();
    });

    /* ================= 7. 날씨 및 Apps Script 동기화 ================= */
    async function fetchWeather() {
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current=temperature_2m,weather_code&timezone=Asia%2FSeoul');
        const data = await res.json();
        const codeMap = { 0: '맑음', 1: '대체로 맑음', 2: '구름 조금', 3: '흐림', 45: '안개', 61: '비', 71: '눈', 95: '뇌우' };
        document.getElementById('temp').textContent = `${Math.round(data.current.temperature_2m)}°C`;
        document.getElementById('weather-desc').textContent = codeMap[data.current.weather_code] || '보통';
      } catch {
        document.getElementById('weather-desc').textContent = '날씨 오류';
      }
    }

    async function fetchDashboardData() {
      const token = localStorage.getItem(STORAGE_KEY);
      if (!token) {
        showPairingScreen();
        return;
      }
      if (!GAS_ENDPOINT.startsWith('http')) {
        document.getElementById('sync-status').textContent = 'NO_URL';
        return;
      }

      try {
        document.getElementById('sync-status').textContent = 'SYNCING';
        const res = await fetch(`${GAS_ENDPOINT}?token=${encodeURIComponent(token)}`);
        const data = await res.json();

        if (data.status === 'unauthorized') {
          localStorage.removeItem(STORAGE_KEY);
          document.getElementById('schedule-list').innerHTML = '';
          document.getElementById('feed-list').innerHTML = '';
          showPairingScreen('유효하지 않거나 만료된 토큰입니다. 다시 페어링하세요.');
          return;
        }
        if (data.status === 'blocked') {
          document.getElementById('sync-status').textContent = 'BLOCKED';
          return;
        }

        hidePairingScreen();
        keepScreenAwake();
        renderData(data);
        document.getElementById('sync-status').textContent = 'SYNCED';
      } catch {
        document.getElementById('sync-status').textContent = 'OFFLINE';
      }
    }

    async function toggleMemoDone(rowNum, nextDone, itemEl) {
      const token = localStorage.getItem(STORAGE_KEY);
      if (!token || !rowNum || !GAS_ENDPOINT.startsWith('http')) return;

      const checkEl = itemEl.querySelector('.feed-check');
      const syncStatusEl = document.getElementById('sync-status');

      itemEl.classList.toggle('done', nextDone);
      checkEl.textContent = nextDone ? '✓' : '';
      syncStatusEl.textContent = 'SAVING';

      try {
        const res = await fetch(GAS_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'toggle', token: token, row: rowNum, done: nextDone })
        });
        const result = await res.json();
        if (result.status !== 'ok') throw new Error('Update failed');
        syncStatusEl.textContent = 'SYNCED';
      } catch {
        const rollbackDone = !nextDone;
        itemEl.classList.toggle('done', rollbackDone);
        checkEl.textContent = rollbackDone ? '✓' : '';
        syncStatusEl.textContent = 'SAVE_ERR';
      }
    }

    function createFeedElement(f) {
      const div = document.createElement('div');
      div.className = 'feed-item' + (f.done ? ' done' : '');
      div.innerHTML = `
        <span class="feed-check">${f.done ? '✓' : ''}</span>
        <span class="feed-tag"></span>
        <span class="feed-text"></span>
      `;
      div.querySelector('.feed-tag').textContent = f.source;
      div.querySelector('.feed-text').textContent = f.title;

      if (f.row) {
        div.addEventListener('click', () => {
          const isCurrentlyDone = div.classList.contains('done');
          toggleMemoDone(f.row, !isCurrentlyDone, div);
        });
      }
      return div;
    }

    function renderData(data) {
      const scheduleEl = document.getElementById('schedule-list');
      scheduleEl.innerHTML = '';
      const events = data.events || [];
      events.forEach(ev => {
        const div = document.createElement('div');
        div.className = 'item';
        div.style.borderLeftColor = ev.color || '#3b82f6';
        div.innerHTML = `<div class="item-time"></div><div class="item-title"></div>`;
        div.querySelector('.item-time').textContent = `${ev.time} · ${ev.calendar}`;
        div.querySelector('.item-title').textContent = ev.title;
        scheduleEl.appendChild(div);
      });
      document.getElementById('event-count').textContent = `${events.length}건`;

      const feedEl = document.getElementById('feed-list');
      feedEl.innerHTML = '';
      (data.feeds || []).forEach(f => {
        feedEl.appendChild(createFeedElement(f));
      });
    }

    document.getElementById('pair-submit').addEventListener('click', () => {
      const val = tokenInput.value.trim();
      if (!val) return;
      localStorage.setItem(STORAGE_KEY, val);
      keepScreenAwake();
      fetchDashboardData();
    });

    tokenInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('pair-submit').click();
    });

    document.getElementById('unpair-btn').addEventListener('click', () => {
      if (confirm('이 기기의 페어링을 해제할까요?')) {
        localStorage.removeItem(STORAGE_KEY);
        document.getElementById('schedule-list').innerHTML = '';
        document.getElementById('feed-list').innerHTML = '';
        showPairingScreen('페어링이 해제되었습니다.');
      }
    });

    /* ================= 8. 초기화 실행 ================= */
    initPairing();
    updateClock();
    renderPomo();
    renderDday();
    fetchWeather();
    fetchDashboardData();

    setInterval(updateClock, 1000);
    setInterval(renderDday, 60 * 60 * 1000);
    setInterval(shiftPixels, 5 * 60 * 1000);
    setInterval(fetchWeather, 30 * 60 * 1000);
    setInterval(fetchDashboardData, 5 * 60 * 1000);
  </script>
</body>
</html>
