<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Desk Dashboard</title>
  <style>
    :root {
      --bg: #000000;
      --card: #121214;
      --sub-card: #1a1a1e;
      --border: #242429;
      --text-main: #f4f4f6;
      --text-sub: #8e8e93;
      --accent: #3b82f6;
      --green: #10b981;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif;
      height: 100vh;
      overflow: hidden;
      padding: 16px;
      transition: filter 0.5s ease, transform 1s ease;
    }
    body.night-mode { filter: brightness(0.4); }

    /* 모달 공통 */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    .overlay.hidden { display: none; }
    .modal-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      width: 100%;
      max-width: 390px;
      text-align: center;
    }
    .modal-box h2 { font-size: 1.2rem; margin-bottom: 10px; }
    .modal-box p { font-size: 0.85rem; color: var(--text-sub); line-height: 1.5; margin-bottom: 18px; }
    .modal-box input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #1c1c20;
      color: var(--text-main);
      font-size: 0.95rem;
      margin-bottom: 12px;
      outline: none;
    }
    .modal-box input:focus { border-color: var(--accent); }
    .tag-chips { display: flex; gap: 6px; margin-bottom: 12px; }
    .tag-chip {
      flex: 1;
      padding: 8px 0;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #1c1c20;
      color: var(--text-sub);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .tag-chip.selected {
      background: rgba(59, 130, 246, 0.2);
      border-color: var(--accent);
      color: var(--text-main);
    }
    .tag-chip[data-val="업무"].selected,
    .tag-chip[data-list="업무"].selected {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--green);
      color: var(--text-main);
    }
    .modal-actions { display: flex; gap: 8px; }
    .modal-box button.primary-btn {
      flex: 1;
      padding: 11px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .modal-box button.cancel-btn {
      flex: 1;
      padding: 11px;
      border-radius: 10px;
      border: none;
      background: #27272a;
      color: var(--text-sub);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .pair-error { color: var(--danger); font-size: 0.8rem; margin-top: 10px; min-height: 1.2em; }

    /* 메인 벤토 그리드 */
    .grid {
      display: grid;
      grid-template-columns: 1.15fr 1.35fr;
      grid-template-rows: 1.05fr 0.65fr 1.15fr;
      gap: 14px;
      height: 100%;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .card-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-sub);
      letter-spacing: 0.05em;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .mini-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-sub);
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .mini-btn.accent {
      border-color: var(--accent);
      color: var(--accent);
    }
    .mini-btn.active {
      background: #27272a;
      border-color: #52525b;
      color: var(--text-main);
    }
    #sync-status {
      cursor: pointer;
      margin-right: 8px;
    }

    /* 1. 시계 & 날씨 */
    .clock-time { font-size: 4.1rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
    .clock-date { font-size: 1.05rem; color: var(--text-sub); margin-top: 6px; }
    .weather-box {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .temp { font-size: 2rem; font-weight: 600; }
    .weather-desc { color: var(--text-sub); font-size: 0.95rem; }

    /* 2. D-Day 단독 카드 */
    .dday-card {
      cursor: pointer;
      justify-content: space-between;
      user-select: none;
    }
    .dday-actions {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .dday-main {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: auto 0;
    }
    .dday-count {
      font-size: 2.3rem;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
    }
    .dday-count.today { color: var(--green); }
    .dday-count.past { color: var(--text-sub); }
    .dday-label-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .dday-group-badge {
      font-size: 0.68rem;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(59, 130, 246, 0.16);
      color: var(--accent);
      flex-shrink: 0;
      font-weight: 600;
    }
    .dday-group-badge.work {
      background: rgba(16, 185, 129, 0.16);
      color: var(--green);
    }
    .dday-label {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 3. Google Tasks 할 일 */
    .task-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
    .feed-item {
      padding: 9px 10px;
      border-radius: 10px;
      background: var(--sub-card);
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.2s, background 0.15s;
    }
    .feed-item:active { background: #242429; }
    .feed-check {
      width: 16px;
      height: 16px;
      border-radius: 5px;
      border: 1.5px solid var(--text-sub);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      flex-shrink: 0;
    }
    .feed-item.done { opacity: 0.45; }
    .feed-item.done .feed-check {
      background: var(--green);
      border-color: var(--green);
      color: #000;
      font-weight: 700;
    }
    .feed-item.done .feed-text { text-decoration: line-through; }
    .feed-tag {
      font-size: 0.68rem;
      padding: 2px 6px;
      border-radius: 6px;
      background: #27272a;
      color: #a1a1aa;
      flex-shrink: 0;
    }
    .feed-tag.work {
      background: rgba(16, 185, 129, 0.16);
      color: var(--green);
    }
    .feed-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 4. 우측 전체: 분류(개인/업무) + 세부 카테고리 필터 */
    .schedule-card { grid-row: 1 / 4; grid-column: 2 / 3; }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .filter-btn {
      background: var(--sub-card);
      border: 1px solid var(--border);
      color: var(--text-sub);
      font-size: 0.74rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }
    .filter-btn[data-group="업무"].active {
      background: var(--green);
      border-color: var(--green);
      color: #000000;
    }

    .sub-filter-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .sub-filter-bar.hidden { display: none; }
    .sub-chip {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-sub);
      font-size: 0.7rem;
      padding: 3px 9px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }
    .sub-chip.active {
      background: #27272a;
      border-color: #52525b;
      color: var(--text-main);
    }

    .item {
      background: var(--sub-card);
      padding: 12px 14px;
      border-radius: 12px;
      border-left: 4px solid var(--accent);
    }
    .item-time { font-size: 0.78rem; color: var(--text-sub); margin-bottom: 4px; }
    .item-title { font-size: 0.98rem; font-weight: 500; }
    .empty-msg {
      color: var(--text-sub);
      font-size: 0.85rem;
      text-align: center;
      margin-top: 24px;
    }
  </style>
</head>
<body>

  <!-- 최초 1회 페어링 모달 -->
  <div id="pairing-overlay" class="overlay hidden">
    <div class="modal-box">
      <h2>기기 최초 페어링</h2>
      <p>페어링 QR 코드를 스캔하거나<br>발급받은 ACCESS_TOKEN을 입력하세요.</p>
      <input type="password" id="token-input" placeholder="64자리 토큰 입력" autocomplete="off" />
      <div class="modal-actions">
        <button class="primary-btn" id="pair-submit">기기 연결</button>
      </div>
      <div class="pair-error" id="pair-error"></div>
    </div>
  </div>

  <!-- 디데이 추가/수정 모달 (구글 시트 연동 + 분류 선택) -->
  <div id="dday-overlay" class="overlay hidden">
    <div class="modal-box">
      <h2 id="dday-modal-title">D-Day 설정</h2>
      <p>구글 시트 Dday 탭(A:제목, B:목표일, C:분류)에 저장됩니다.</p>
      <div class="tag-chips" id="dday-group-chips">
        <button type="button" class="tag-chip selected" data-val="개인">개인</button>
        <button type="button" class="tag-chip" data-val="업무">업무</button>
      </div>
      <input type="text" id="dday-title-input" placeholder="예: 프로젝트 마감" maxlength="30" />
      <input type="date" id="dday-date-input" />
      <div class="modal-actions">
        <button class="cancel-btn" id="dday-cancel">취소</button>
        <button class="primary-btn" id="dday-save">시트에 저장</button>
      </div>
    </div>
  </div>

  <!-- 새 할 일(Google Tasks) 추가 모달 -->
  <div id="task-overlay" class="overlay hidden">
    <div class="modal-box">
      <h2>Google Tasks 할 일 추가</h2>
      <p>선택한 Google Tasks 목록에 즉시 등록됩니다.</p>
      <div class="tag-chips" id="task-list-chips">
        <button type="button" class="tag-chip selected" data-list="내 할 일">개인 (내 할 일)</button>
        <button type="button" class="tag-chip" data-list="업무">업무</button>
      </div>
      <input type="text" id="task-text-input" placeholder="할 일을 입력하세요 (최대 120자)" maxlength="120" autocomplete="off" />
      <div class="modal-actions">
        <button class="cancel-btn" id="task-cancel">취소</button>
        <button class="primary-btn" id="task-save">Tasks에 추가</button>
      </div>
    </div>
  </div>

  <!-- 대시보드 그리드 -->
  <div class="grid" id="dashboard-grid">
    <!-- 좌측 상단: 시계 & 날씨 -->
    <div class="card">
      <div class="card-title">
        <span>SEOUL, KR</span>
        <div>
          <span id="sync-status" title="터치하여 즉시 동기화">INIT</span>
          <button class="mini-btn" id="unpair-btn">UNPAIR</button>
        </div>
      </div>
      <div class="clock-time" id="clock">00:00</div>
      <div class="clock-date" id="date">----년 --월 --일</div>
      <div class="weather-box">
        <span class="temp" id="temp">--°</span>
        <span class="weather-desc" id="weather-desc">날씨 불러오는 중...</span>
      </div>
    </div>

    <!-- 좌측 중단: D-Day 단독 위젯 -->
    <div class="card dday-card" id="dday-widget" title="터치하여 다음 D-Day 보기">
      <div class="card-title">
        <span>D-DAY <span id="dday-index-badge"></span></span>
        <div class="dday-actions">
          <span id="dday-target-date" style="margin-right: 2px;">--.--</span>
          <button type="button" class="mini-btn" id="dday-past-toggle" title="이미 지난 D+ 항목 표시 전환">지난일정</button>
          <button type="button" class="mini-btn" id="dday-edit-btn">수정</button>
          <button type="button" class="mini-btn accent" id="dday-add-btn">+</button>
        </div>
      </div>
      <div class="dday-main">
        <span class="dday-count" id="dday-count">D-?</span>
        <div class="dday-label-wrap">
          <span class="dday-group-badge" id="dday-group-badge" style="display:none;">개인</span>
          <span class="dday-label" id="dday-label">시트에서 불러오는 중...</span>
        </div>
      </div>
    </div>

    <!-- 좌측 하단: Google Tasks 할 일 (미완료/완료/전체 분류) -->
    <div class="card">
      <div class="card-title">
        <span>TASKS (<span id="task-count">0</span>)</span>
        <div class="task-controls" id="task-status-filters">
          <button type="button" class="mini-btn active" data-status="TODO">미완료</button>
          <button type="button" class="mini-btn" data-status="DONE">완료</button>
          <button type="button" class="mini-btn" data-status="ALL">전체</button>
          <button type="button" class="mini-btn accent" id="open-task-btn">+ 할 일</button>
        </div>
      </div>
      <div class="list" id="task-list"></div>
    </div>

    <!-- 우측 전체: 일정 + 분류(개인/업무) + 세부 카테고리 필터 -->
    <div class="card schedule-card">
      <div class="card-title">
        <span>SCHEDULE (<span id="event-count">0</span>)</span>
        <div class="filter-group" id="group-filters">
          <button type="button" class="filter-btn active" data-group="ALL">전체</button>
          <button type="button" class="filter-btn" data-group="개인">개인</button>
          <button type="button" class="filter-btn" data-group="업무">업무</button>
        </div>
      </div>
      <div class="sub-filter-bar hidden" id="sub-category-bar"></div>
      <div class="list" id="schedule-list"></div>
    </div>
  </div>

  <script>
    const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbyP9FFbaBjKNrDfc1OcrfP0UnA4yy5ue86zwYx8ids32isjxReJiIWGz0lJQ5IfJ7N3dQ/exec";
    const STORAGE_KEY = "DESK_PAIRED_TOKEN";

    let cachedEvents = [];
    let cachedTasks = [];
    let cachedDdays = [];
    let showPastDdays = false;
    let currentDdayIndex = 0;
    let editingDdayRow = 0;
    let selectedModalDdayGroup = '개인';
    let selectedGroup = 'ALL';      // 'ALL' | '개인' | '업무'
    let selectedCategory = 'ALL';
    let selectedTaskStatus = 'TODO'; // 'TODO' (미완료) | 'DONE' (완료) | 'ALL' (전체)

    /* ================= 1. 최초 1회 페어링 ================= */
    const pairingOverlay = document.getElementById('pairing-overlay');
    const tokenInput = document.getElementById('token-input');
    const pairError = document.getElementById('pair-error');

    function initPairing() {
      const existingToken = localStorage.getItem(STORAGE_KEY);
      const hash = window.location.hash;
      if (!existingToken && hash.startsWith('#token=')) {
        const extracted = decodeURIComponent(hash.replace('#token=', '')).trim();
        if (extracted) localStorage.setItem(STORAGE_KEY, extracted);
      }
      if (hash) {
        history.replaceState(null, '', window.location.pathname + window.location.search);
      }
    }

    function showPairingScreen(msg = '') {
      pairError.textContent = msg;
      pairingOverlay.classList.remove('hidden');
      tokenInput.value = '';
    }

    function hidePairingScreen() {
      pairingOverlay.classList.add('hidden');
      pairError.textContent = '';
    }

    /* ================= 2. 화면 상시 유지 & 번인 방지 ================= */
    async function keepScreenAwake() {
      try {
        if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
      } catch {}
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') keepScreenAwake();
    });

    function shiftPixels() {
      const x = Math.floor(Math.random() * 5) - 2;
      const y = Math.floor(Math.random() * 5) - 2;
      document.body.style.transform = `translate(${x}px, ${y}px)`;
    }

    /* ================= 3. 시계 & 야간 디밍 ================= */
    function updateClock() {
      const now = new Date();
      const h = now.getHours();
      const m = now.getMinutes();
      const s = now.getSeconds();

      document.getElementById('clock').textContent =
        `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      document.getElementById('date').textContent =
        `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 ${days[now.getDay()]}요일`;

      document.body.classList.toggle('night-mode', h >= 23 || h < 6);
      if (h === 4 && m === 0 && s === 0) location.reload();
    }

    /* ================= 4. 구글 시트 연동 디데이 ================= */
    const ddayOverlay = document.getElementById('dday-overlay');
    const ddayModalTitle = document.getElementById('dday-modal-title');
    const ddayTitleInput = document.getElementById('dday-title-input');
    const ddayDateInput = document.getElementById('dday-date-input');
    const ddaySaveBtn = document.getElementById('dday-save');
    const pastToggleBtn = document.getElementById('dday-past-toggle');

    document.querySelectorAll('#dday-group-chips .tag-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#dday-group-chips .tag-chip').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedModalDdayGroup = btn.dataset.val;
      });
    });

    function setModalDdayGroup(val) {
      selectedModalDdayGroup = val === '업무' ? '업무' : '개인';
      document.querySelectorAll('#dday-group-chips .tag-chip').forEach(b => {
        b.classList.toggle('selected', b.dataset.val === selectedModalDdayGroup);
      });
    }

    function getVisibleDdays() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      let list = cachedDdays || [];
      if (selectedGroup !== 'ALL') {
        list = list.filter(item => (item.group || '개인') === selectedGroup);
      }

      const enriched = list.map(item => {
        const target = new Date(item.date + 'T00:00:00');
        const diffDays = Math.round((target - today) / (1000 * 60 * 60 * 24));
        return { ...item, diffDays };
      }).sort((a, b) => a.diffDays - b.diffDays);

      if (!showPastDdays) {
        return enriched.filter(item => item.diffDays >= 0);
      }
      return enriched;
    }

    function renderDday() {
      const countEl = document.getElementById('dday-count');
      const labelEl = document.getElementById('dday-label');
      const groupBadgeEl = document.getElementById('dday-group-badge');
      const dateEl = document.getElementById('dday-target-date');
      const badgeEl = document.getElementById('dday-index-badge');
      const editBtn = document.getElementById('dday-edit-btn');

      pastToggleBtn.classList.toggle('active', showPastDdays);

      const visibleList = getVisibleDdays();

      if (visibleList.length === 0) {
        countEl.textContent = 'D-?';
        countEl.className = 'dday-count';
        groupBadgeEl.style.display = 'none';
        labelEl.textContent = selectedGroup !== 'ALL'
          ? `${selectedGroup} D-Day 없음 (+ 버튼으로 추가)`
          : (cachedDdays.length > 0 ? '다가오는 D-Day 없음 (지난일정 확인)' : '+ 버튼을 눌러 D-Day 추가');
        dateEl.textContent = '--.--';
        badgeEl.textContent = '';
        editBtn.style.display = 'none';
        return;
      }

      if (currentDdayIndex >= visibleList.length) currentDdayIndex = 0;
      const item = visibleList[currentDdayIndex];

      countEl.className = 'dday-count';
      if (item.diffDays === 0) {
        countEl.textContent = 'D-DAY';
        countEl.classList.add('today');
      } else if (item.diffDays > 0) {
        countEl.textContent = `D-${item.diffDays}`;
      } else {
        countEl.textContent = `D+${Math.abs(item.diffDays)}`;
        countEl.classList.add('past');
      }

      const itemGroup = item.group || '개인';
      groupBadgeEl.style.display = 'inline-block';
      groupBadgeEl.textContent = itemGroup;
      groupBadgeEl.className = 'dday-group-badge' + (itemGroup === '업무' ? ' work' : '');

      labelEl.textContent = item.title;
      dateEl.textContent = item.date.slice(5).replace('-', '.');
      badgeEl.textContent = visibleList.length > 1 ? `(${currentDdayIndex + 1}/${visibleList.length})` : '';
      editBtn.style.display = 'inline-block';
    }

    pastToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      showPastDdays = !showPastDdays;
      currentDdayIndex = 0;
      renderDday();
    });

    document.getElementById('dday-widget').addEventListener('click', (e) => {
      if (e.target.closest('button')) return;
      const visibleList = getVisibleDdays();
      if (visibleList.length > 1) {
        currentDdayIndex = (currentDdayIndex + 1) % visibleList.length;
        renderDday();
      } else if (visibleList.length === 0) {
        openDdayModal(0);
      }
    });

    function openDdayModal(rowToEdit) {
      editingDdayRow = rowToEdit;
      const visibleList = getVisibleDdays();
      const currentItem = visibleList[currentDdayIndex];

      if (rowToEdit >= 2 && currentItem) {
        ddayModalTitle.textContent = 'D-Day 수정';
        ddayTitleInput.value = currentItem.title;
        ddayDateInput.value = currentItem.date;
        setModalDdayGroup(currentItem.group || '개인');
      } else {
        ddayModalTitle.textContent = '새 D-Day 추가';
        ddayTitleInput.value = '';
        ddayDateInput.value = '';
        setModalDdayGroup(selectedGroup === '업무' ? '업무' : '개인');
      }
      ddayOverlay.classList.remove('hidden');
      ddayTitleInput.focus();
    }

    document.getElementById('dday-edit-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      const visibleList = getVisibleDdays();
      const targetRow = visibleList[currentDdayIndex] ? visibleList[currentDdayIndex].row : 0;
      openDdayModal(targetRow);
    });

    document.getElementById('dday-add-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      openDdayModal(0);
    });

    document.getElementById('dday-cancel').addEventListener('click', () => {
      ddayOverlay.classList.add('hidden');
    });

    ddaySaveBtn.addEventListener('click', async () => {
      const title = ddayTitleInput.value.trim();
      const date = ddayDateInput.value;
      const token = localStorage.getItem(STORAGE_KEY);
      if (!title || !date || !token || !GAS_ENDPOINT.startsWith('http')) return;

      ddaySaveBtn.disabled = true;
      ddaySaveBtn.textContent = '저장 중...';
      document.getElementById('sync-status').textContent = 'SAVING';

      try {
        const res = await fetch(GAS_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'save_dday',
            token: token,
            row: editingDdayRow,
            title: title,
            date: date,
            group: selectedModalDdayGroup
          })
        });
        const result = await res.json();
        if (result.status !== 'ok') throw new Error('Save failed');

        if (editingDdayRow >= 2) {
          const idx = cachedDdays.findIndex(d => d.row === editingDdayRow);
          if (idx !== -1) cachedDdays[idx] = result.item;
        } else {
          cachedDdays.push(result.item);
        }

        currentDdayIndex = 0;
        renderDday();
        ddayOverlay.classList.add('hidden');
        document.getElementById('sync-status').textContent = 'SYNCED';
      } catch {
        document.getElementById('sync-status').textContent = 'SAVE_ERR';
        alert('D-Day 저장에 실패했습니다. DDAY_SHEET_ID 설정을 확인하세요.');
      } finally {
        ddaySaveBtn.disabled = false;
        ddaySaveBtn.textContent = '시트에 저장';
      }
    });

    /* ================= 5. 새 할 일(Google Tasks) 모달 ================= */
    const taskOverlay = document.getElementById('task-overlay');
    const taskTextInput = document.getElementById('task-text-input');
    const taskSaveBtn = document.getElementById('task-save');
    let selectedNewTaskList = '내 할 일';

    document.querySelectorAll('#task-list-chips .tag-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#task-list-chips .tag-chip').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedNewTaskList = btn.dataset.list;
      });
    });

    document.getElementById('open-task-btn').addEventListener('click', () => {
      const defaultTarget = selectedGroup === '업무' ? '업무' : '내 할 일';
      document.querySelectorAll('#task-list-chips .tag-chip').forEach(b => {
        b.classList.toggle('selected', b.dataset.list === defaultTarget);
      });
      selectedNewTaskList = defaultTarget;

      taskTextInput.value = '';
      taskOverlay.classList.remove('hidden');
      taskTextInput.focus();
    });

    document.getElementById('task-cancel').addEventListener('click', () => {
      taskOverlay.classList.add('hidden');
    });

    async function submitNewTask() {
      const title = taskTextInput.value.trim();
      const token = localStorage.getItem(STORAGE_KEY);
      if (!title || !token || !GAS_ENDPOINT.startsWith('http')) return;

      taskSaveBtn.disabled = true;
      taskSaveBtn.textContent = '등록 중...';
      document.getElementById('sync-status').textContent = 'SAVING';

      try {
        const res = await fetch(GAS_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'add', token: token, listTitle: selectedNewTaskList, title: title })
        });
        const result = await res.json();
        if (result.status !== 'ok') throw new Error('Add failed');

        cachedTasks.unshift(result.item);
        renderTasks();

        taskOverlay.classList.add('hidden');
        document.getElementById('sync-status').textContent = 'SYNCED';
      } catch {
        document.getElementById('sync-status').textContent = 'SAVE_ERR';
        alert('할 일 등록에 실패했습니다. Tasks API 설정을 확인하세요.');
      } finally {
        taskSaveBtn.disabled = false;
        taskSaveBtn.textContent = 'Tasks에 추가';
      }
    }

    taskSaveBtn.addEventListener('click', submitNewTask);
    taskTextInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitNewTask();
    });

    /* ================= 6. 분류(개인/업무) & 카테고리별 일정 + Tasks(완료/미완료) 렌더링 ================= */
    function renderSubCategories() {
      const subBar = document.getElementById('sub-category-bar');
      subBar.innerHTML = '';

      if (selectedGroup === 'ALL') {
        subBar.classList.add('hidden');
        return;
      }

      const groupEvents = cachedEvents.filter(ev => ev.group === selectedGroup);
      const categories = ['ALL', ...new Set(groupEvents.map(ev => ev.category).filter(Boolean))];

      if (categories.length <= 1) {
        subBar.classList.add('hidden');
        return;
      }

      subBar.classList.remove('hidden');
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'sub-chip' + (selectedCategory === cat ? ' active' : '');
        btn.textContent = cat === 'ALL' ? '전체 카테고리' : cat;
        btn.addEventListener('click', () => {
          selectedCategory = cat;
          renderSubCategories();
          renderSchedules();
        });
        subBar.appendChild(btn);
      });
    }

    function renderSchedules() {
      const scheduleEl = document.getElementById('schedule-list');
      scheduleEl.innerHTML = '';

      let filtered = cachedEvents;
      if (selectedGroup !== 'ALL') {
        filtered = filtered.filter(ev => ev.group === selectedGroup);
      }
      if (selectedCategory !== 'ALL') {
        filtered = filtered.filter(ev => ev.category === selectedCategory);
      }

      if (filtered.length === 0) {
        scheduleEl.innerHTML = '<div class="empty-msg">표시할 일정이 없습니다.</div>';
      } else {
        filtered.forEach(ev => {
          const div = document.createElement('div');
          div.className = 'item';
          div.style.borderLeftColor = ev.color || '#3b82f6';
          div.innerHTML = `<div class="item-time"></div><div class="item-title"></div>`;
          div.querySelector('.item-time').textContent = `${ev.time} · ${ev.group} / ${ev.category}`;
          div.querySelector('.item-title').textContent = ev.title;
          scheduleEl.appendChild(div);
        });
      }

      document.getElementById('event-count').textContent = filtered.length;
    }

    function renderTasks() {
      const taskEl = document.getElementById('task-list');
      const countEl = document.getElementById('task-count');
      taskEl.innerHTML = '';

      // 1) 상단 전체/개인/업무 그룹 필터 적용
      let filteredTasks = cachedTasks;
      if (selectedGroup === '업무') {
        filteredTasks = filteredTasks.filter(t => t.listTitle === '업무');
      } else if (selectedGroup === '개인') {
        filteredTasks = filteredTasks.filter(t => t.listTitle !== '업무');
      }

      // 2) 미완료 / 완료 / 전체 상태 필터 적용
      if (selectedTaskStatus === 'TODO') {
        filteredTasks = filteredTasks.filter(t => !t.done);
      } else if (selectedTaskStatus === 'DONE') {
        filteredTasks = filteredTasks.filter(t => t.done);
      }

      // 3) 전체 보기일 경우 미완료를 위쪽에, 완료를 아래쪽에 정렬
      const sortedTasks = [...filteredTasks].sort((a, b) => Number(a.done) - Number(b.done));
      countEl.textContent = sortedTasks.length;

      if (sortedTasks.length === 0) {
        const emptyLabel = selectedTaskStatus === 'TODO'
          ? '남은 할 일이 없습니다.'
          : (selectedTaskStatus === 'DONE' ? '완료된 할 일이 없습니다.' : '표시할 할 일이 없습니다.');
        taskEl.innerHTML = `<div class="empty-msg">${emptyLabel}</div>`;
        return;
      }

      sortedTasks.forEach(t => {
        const div = document.createElement('div');
        div.className = 'feed-item' + (t.done ? ' done' : '');
        const isWork = t.listTitle === '업무';
        div.innerHTML = `
          <span class="feed-check">${t.done ? '✓' : ''}</span>
          <span class="feed-tag ${isWork ? 'work' : ''}"></span>
          <span class="feed-text"></span>
        `;
        div.querySelector('.feed-tag').textContent = t.listTitle;
        div.querySelector('.feed-text').textContent = t.title;

        if (t.taskId && t.listId) {
          div.addEventListener('click', () => {
            const isCurrentlyDone = div.classList.contains('done');
            toggleTaskDone(t, !isCurrentlyDone, div);
          });
        }
        taskEl.appendChild(div);
      });
    }

    // Tasks 미완료 / 완료 / 전체 버튼 이벤트
    document.querySelectorAll('#task-status-filters button[data-status]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#task-status-filters button[data-status]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedTaskStatus = btn.dataset.status;
        renderTasks();
      });
    });

    document.querySelectorAll('#group-filters .filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#group-filters .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedGroup = btn.dataset.group;
        selectedCategory = 'ALL';
        currentDdayIndex = 0;

        renderSubCategories();
        renderSchedules();
        renderTasks();
        renderDday();
      });
    });

    /* ================= 7. 날씨 및 Apps Script 동기화 ================= */
    async function fetchWeather() {
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current=temperature_2m,weather_code&timezone=Asia%2FSeoul');
        const data = await res.json();
        const codeMap = { 0: '맑음', 1: '대체로 맑음', 2: '구름 조금', 3: '흐림', 45: '안개', 61: '비', 71: '눈', 95: '뇌우' };
        document.getElementById('temp').textContent = `${Math.round(data.current.temperature_2m)}°C`;
        document.getElementById('weather-desc').textContent = codeMap[data.current.weather_code] || '보통';
      } catch {
        document.getElementById('weather-desc').textContent = '날씨 오류';
      }
    }

    async function fetchDashboardData() {
      const token = localStorage.getItem(STORAGE_KEY);
      if (!token) {
        showPairingScreen();
        return;
      }
      if (!GAS_ENDPOINT.startsWith('http')) {
        document.getElementById('sync-status').textContent = 'NO_URL';
        return;
      }

      try {
        document.getElementById('sync-status').textContent = 'SYNCING';
        const res = await fetch(`${GAS_ENDPOINT}?token=${encodeURIComponent(token)}`);
        const data = await res.json();

        if (data.status === 'unauthorized') {
          localStorage.removeItem(STORAGE_KEY);
          cachedEvents = [];
          cachedTasks = [];
          cachedDdays = [];
          renderSubCategories();
          renderSchedules();
          renderTasks();
          renderDday();
          showPairingScreen('유효하지 않거나 만료된 토큰입니다. 다시 페어링하세요.');
          return;
        }
        if (data.status === 'blocked') {
          document.getElementById('sync-status').textContent = 'BLOCKED';
          return;
        }

        hidePairingScreen();
        keepScreenAwake();

        cachedEvents = data.events || [];
        cachedTasks = data.tasks || [];
        cachedDdays = data.ddays || [];

        renderSubCategories();
        renderSchedules();
        renderTasks();
        renderDday();

        document.getElementById('sync-status').textContent = 'SYNCED';
      } catch {
        document.getElementById('sync-status').textContent = 'OFFLINE';
      }
    }

    async function toggleTaskDone(taskObj, nextDone, itemEl) {
      const token = localStorage.getItem(STORAGE_KEY);
      if (!token || !taskObj.taskId || !GAS_ENDPOINT.startsWith('http')) return;

      const syncStatusEl = document.getElementById('sync-status');
      const prevDone = taskObj.done;

      taskObj.done = nextDone;
      renderTasks();
      syncStatusEl.textContent = 'SAVING';

      try {
        const res = await fetch(GAS_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'toggle',
            token: token,
            listId: taskObj.listId,
            taskId: taskObj.taskId,
            done: nextDone
          })
        });
        const result = await res.json();
        if (result.status !== 'ok') throw new Error('Update failed');
        syncStatusEl.textContent = 'SYNCED';
      } catch {
        taskObj.done = prevDone;
        renderTasks();
        syncStatusEl.textContent = 'SAVE_ERR';
      }
    }

    document.getElementById('sync-status').addEventListener('click', fetchDashboardData);

    document.getElementById('pair-submit').addEventListener('click', () => {
      const val = tokenInput.value.trim();
      if (!val) return;
      localStorage.setItem(STORAGE_KEY, val);
      keepScreenAwake();
      fetchDashboardData();
    });

    tokenInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('pair-submit').click();
    });

    document.getElementById('unpair-btn').addEventListener('click', () => {
      if (confirm('이 기기의 페어링을 해제할까요?')) {
        localStorage.removeItem(STORAGE_KEY);
        cachedEvents = [];
        cachedTasks = [];
        cachedDdays = [];
        renderSubCategories();
        renderSchedules();
        renderTasks();
        renderDday();
        showPairingScreen('페어링이 해제되었습니다.');
      }
    });

    /* ================= 8. 초기화 실행 ================= */
    initPairing();
    updateClock();
    renderDday();
    fetchWeather();
    fetchDashboardData();

    setInterval(updateClock, 1000);
    setInterval(renderDday, 60 * 60 * 1000);
    setInterval(shiftPixels, 5 * 60 * 1000);
    setInterval(fetchWeather, 30 * 60 * 1000);
    setInterval(fetchDashboardData, 5 * 60 * 1000);
  </script>
</body>
</html>
